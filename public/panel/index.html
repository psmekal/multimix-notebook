<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>MultiMix – Světelný panel</title>
  <style>
    html { background: #000; }
    html, body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'Arial Black', system-ui, sans-serif; }
    body { width: 1040px; height: 208px; background: #000; }
    html:fullscreen, html:fullscreen body,
    html:-webkit-full-screen, html:-webkit-full-screen body { cursor: none; }
    /* exact 1040×208 at top-left — never scale to the window */
    #stage { position: absolute; top: 0; left: 0; width: 1040px; height: 208px; background: #000; }
    #dprDebug {
      display: none; position: absolute; top: 0; left: 0; z-index: 999;
      background: #ffd24d; color: #000; font: 12px/1.35 Consolas, monospace;
      padding: 4px 8px; pointer-events: none; white-space: pre;
    }

    #bugWrap {
      position: absolute; inset: 4px;
      display: flex; align-items: stretch;
      opacity: 0;
    }
    #bug { flex: 1; min-width: 0; min-height: 0; }
    .susps { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; max-width: 100%; }
    .side.home .susps { justify-content: flex-start; }
    .side.away .susps { justify-content: flex-end; }
    .flash {
      position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      z-index: 5; display: flex; align-items: center; justify-content: center; pointer-events: none;
    }

    #bug {
      --home: #1d3fb8; --away: #b81d1d; --home-text: #fff; --away-text: #fff;
      display: flex; align-items: stretch;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.55));
    }
    .wing { display: flex; align-items: stretch; flex: 1; min-width: 0; }
    .wing.home { transform-origin: right center; }
    .wing.away { transform-origin: left center; }

    .side {
      position: relative; flex: 1; min-width: 0; overflow: hidden;
      display: flex; align-items: center; gap: 8px; padding: 0 10px;
      font-size: 26px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; line-height: 1;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.35);
    }
    .side.home {
      justify-content: flex-start; color: var(--home-text); border-radius: 10px 0 0 10px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,0) 42%, rgba(0,0,0,.30) 100%),
        var(--home);
    }
    .side.away {
      justify-content: flex-end; text-align: right; color: var(--away-text); border-radius: 0 10px 10px 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,0) 42%, rgba(0,0,0,.30) 100%),
        var(--away);
    }
    .side .meta {
      display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 0; gap: 6px;
    }
    .side.home .meta { align-items: flex-start; }
    .side.away .meta { align-items: flex-end; }
    .side .name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 100%;
      text-shadow: 0 2px 3px rgba(0,0,0,.5);
    }
    .todots { display: inline-flex; gap: 5px; align-items: center; flex-shrink: 0; }
    .todots .d { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.30);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
    .todots .d.used { background: #ffd24d; box-shadow: 0 0 7px rgba(255,210,77,.8); }

    .side img {
      height: 92px; width: 92px; object-fit: contain; flex-shrink: 0;
      background: none; padding: 0; border: 0; border-radius: 0; box-shadow: none;
    }

    .scorebox {
      position: relative; flex: 0 0 78px; width: 78px;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; color: #fff;
      background: linear-gradient(180deg, #2c3036 0%, #15171b 55%, #050609 100%);
      text-shadow: 0 2px 5px rgba(0,0,0,.7);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
    }
    .scorebox.home { box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -4px 0 var(--home); }
    .scorebox.away { box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -4px 0 var(--away); }

    .clock {
      position: relative; flex: 0 0 132px; width: 132px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 8px;
      background: linear-gradient(180deg, #222730 0%, #0d0f13 60%, #040507 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.20);
    }
    .clock::before {
      content: ''; position: absolute; top: 0; left: 10px; right: 10px; height: 3px; border-radius: 3px;
      background: linear-gradient(90deg, transparent, #ffd24d, #f0b429, transparent);
      box-shadow: 0 0 10px rgba(255,210,77,.65);
    }
    .clock .per { color: #ffd24d; font-size: 22px; font-weight: 800; letter-spacing: 2px; line-height: 1;
      margin-bottom: 2px; text-shadow: 0 0 8px rgba(255,210,77,.45); }
    .clock .time { color: #fff; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1;
      text-shadow: 0 0 14px rgba(255,210,77,.28); }
    .clock.timeout .time { color: #ffd24d; text-shadow: 0 0 16px rgba(255,210,77,.7); }
    .dig { display: inline-block; white-space: pre; }

    .susp-chip {
      background: linear-gradient(180deg, #3a1210 0%, #1c0807 60%, #0d0303 100%);
      box-shadow: inset 0 2px 0 rgba(255,120,110,.4), 0 4px 12px rgba(0,0,0,.5);
      color: #ff8a82; font-size: 14px; font-weight: 800;
      padding: 3px 8px; border-radius: 4px; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .susp-chip b { color: #fff; }

    @keyframes toPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    .flash-stack { display: flex; align-items: center; gap: 6px; }
    .flash-team { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,.7); text-transform: uppercase; }
    .flash-to { background: linear-gradient(180deg, #ffd24d, #e0a91f); color: #1a1205; font-weight: 900;
      font-size: 22px; letter-spacing: 2px; padding: 8px 16px; border-radius: 6px; white-space: nowrap;
      box-shadow: 0 6px 14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.5);
      animation: toPulse 1.6s ease-in-out infinite; }
    .flash-card { min-width: 36px; height: 48px; padding: 0 8px; border-radius: 4px; display: flex;
      align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3); }
    .fc-yellow { background: linear-gradient(180deg, #ffd24d, #d29922); color: #1a1205; }
    .fc-red { background: linear-gradient(180deg, #ff5b53, #c0241d); }
    .fc-blue { background: linear-gradient(180deg, #5b9bff, #2f6fdb); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="dprDebug"></div>
    <div id="bugWrap">
      <div class="flash" id="flash"></div>
      <div id="bug">
        <div class="wing home">
          <div class="side home"><img id="hLogo" style="display:none" alt=""><span class="meta"><span class="name" id="hName"></span><span class="todots" id="hTodots"></span><span class="susps" id="suspHome"></span></span></div>
          <div class="scorebox home" id="hScore">0</div>
        </div>
        <div class="clock" id="clock"><div class="per" id="per">P1</div><div class="time" id="time">00:00</div></div>
        <div class="wing away">
          <div class="scorebox away" id="aScore">0</div>
          <div class="side away"><span class="meta"><span class="name" id="aName"></span><span class="todots" id="aTodots"></span><span class="susps" id="suspAway"></span></span><img id="aLogo" style="display:none" alt=""></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module">import('./panel.js?t=' + Date.now());</script>
</body>
</html>
