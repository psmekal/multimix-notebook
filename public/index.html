<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnaj – živé přenosy</title>
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .match-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 6px; }
    .match-row:hover { background: var(--panel2); }
    .player-box { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
    .player-box iframe { width: 100%; height: 100%; border: 0; }
    .alert-strip { background: var(--panel2); border-left: 4px solid var(--accent); padding: 10px 14px;
      border-radius: 6px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex;justify-content:flex-end;gap:14px;padding:8px 0 4px">
      <a href="/admin/" style="font-size:13px;color:var(--muted)">🎛 Réžia</a>
      <a href="/hall/" style="font-size:13px;color:var(--muted)">🏟 Haly</a>
    </div>
    <div class="grid" id="app">Načítám…</div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module">import('/assets/public.js?t=' + Date.now());</script>
</body>
</html>
