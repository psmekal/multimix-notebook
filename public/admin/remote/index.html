<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiMix – Vzdálené ovládání</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: rgba(20, 22, 28, 0.92);
      --text: #f2f2f4;
      --muted: #9aa0ad;
      --danger: #e35d6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      cursor: default;
    }
    #stage {
      position: fixed; inset: 0;
      background: #000;
      z-index: 1;
      cursor: default;
      touch-action: none;
    }
    #screen {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      background: #000;
    }
    #chrome {
      position: fixed; top: 0; left: 0; right: 0;
      height: 48px;
      display: flex; align-items: center; gap: 14px;
      padding: 0 16px;
      background: var(--panel);
      z-index: 2;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
    #chrome.hidden { opacity: 0; }
    #title, #status, #hint { pointer-events: none; }
    #title { font-weight: 600; font-size: 15px; }
    #status { font-size: 13px; color: var(--muted); flex: 1; }
    #status.ok { color: #6dca8c; }
    #status.err { color: var(--danger); }
    #hint { font-size: 12px; color: var(--muted); white-space: nowrap; }
    #chrome button {
      pointer-events: auto;
      border: 0; border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      background: var(--danger); color: #fff;
    }
    #chrome button.secondary { background: #2a2f3a; color: var(--text); }
    #chrome.hidden button { pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage">
    <img id="screen" alt="" draggable="false">
  </div>
  <div id="chrome">
    <div id="title">Vzdálené ovládání</div>
    <div id="status">Připojuji…</div>
    <div id="hint" class="muted">Ctrl+C / Ctrl+V přenáší text</div>
    <button type="button" class="secondary" id="fsBtn">Celá obrazovka</button>
    <button type="button" id="endBtn">Ukončit</button>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/admin/remote/remote.js?v=5"></script>
</body>
</html>
